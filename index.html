<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Çarpan ve Bölen Keşfi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 10px;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        .game-container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            box-sizing: border-box;
            border: 4px solid #fff;
            outline: 4px dashed #9b59b6;
        }

        h1 {
            color: #8e44ad;
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            line-height: 1.2;
        }

        .instruction-box {
            background: #f1f2f6;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #ff9f43;
            font-size: 1.1rem;
            color: #2f3542;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin-bottom: 15px;
        }

        .cell {
            aspect-ratio: 1;
            background: #fff;
            border: 2px solid #dfe4ea;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: #57606f;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .cell:active { transform: scale(0.9); }

        /* Seçim Durumları */
        .selected {
            background: #ffeaa7;
            border-color: #fdcb6e;
            color: #d63031;
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 2;
        }

        .marked-black {
            background: #2d3436 !important;
            color: #fff !important;
            border-color: #2d3436 !important;
        }

        .marked-red {
            position: relative;
        }
        
        /* Kırmızı kalemi siyahın üzerine eklemek için çerceve */
        .marked-red::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 4px solid #ff4757;
            border-radius: 4px;
            pointer-events: none;
        }

        /* Yanlış Seçim Titremesi */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Doğru Seçim Büyümesi */
        .pop {
            animation: pop 0.4s ease-out;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .next-btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-family: 'Nunito', sans-serif;
        }

        /* Konfeti */
        #confetti {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>
    <div class="game-container">
        <h1>Çarpan ve Bölen Keşfi 🔍</h1>
        
        <div class="instruction-box" id="instruction">
            Görev 1: Çarpımları 50 olan sayı çiftlerini bul ve seç! (Siyah Kalem)
        </div>

        <div class="grid" id="grid">
            <!-- JS ile doldurulacak -->
        </div>

        <button class="next-btn" id="nextBtn" onclick="startPhase2()">Sonraki Görev 👉</button>
        <button class="next-btn" id="restartBtn" onclick="resetGame()" style="background:#3742fa; display:none;">Yeni Sayı İle Oyna 🔄</button>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const instruction = document.getElementById('instruction');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');

        let targetNumber = 50;
        let currentPhase = 1; 
        let firstSelection = null;
        
        let pairsFound = 0;
        let divisorsFound = 0;
        
        let validPairs = [];
        let validDivisors = [];

        function initGame(newTarget = 50) {
            targetNumber = newTarget;
            currentPhase = 1;
            firstSelection = null;
            pairsFound = 0;
            divisorsFound = 0;
            
            validDivisors = [];
            validPairs = [];
            for(let i=1; i<=targetNumber; i++) {
                if(targetNumber % i === 0) {
                    validDivisors.push(i);
                    if(i <= targetNumber/i) {
                        validPairs.push([i, targetNumber/i]);
                    }
                }
            }
            
            instruction.innerHTML = `Görev 1: Çarpımları <b style="color:#e84118">${targetNumber}</b> olan iki sayıyı sırayla seç! (Siyah Kalem)`;
            instruction.style.borderColor = "#2d3436";
            nextBtn.style.display = "none";
            restartBtn.style.display = "none";

            grid.innerHTML = '';
            for(let i = 1; i <= 50; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.innerText = i;
                cell.dataset.val = i;
                cell.onclick = () => handleCellClick(cell, i);
                grid.appendChild(cell);
            }
        }

        function handleCellClick(cell, val) {
            if(currentPhase === 1) {
                // Siyah Kalem - Çarpan Çiftleri
                if(cell.classList.contains('marked-black')) return;
                
                if(!firstSelection) {
                    firstSelection = { cell, val };
                    cell.classList.add('selected');
                } else {
                    if(firstSelection.cell === cell) {
                        cell.classList.remove('selected');
                        firstSelection = null;
                        return;
                    }
                    
                    let num1 = firstSelection.val;
                    let num2 = val;
                    
                    if(num1 * num2 === targetNumber) {
                        firstSelection.cell.classList.remove('selected');
                        firstSelection.cell.classList.add('marked-black', 'pop');
                        cell.classList.add('marked-black', 'pop');
                        pairsFound++;
                        
                        if(pairsFound === validPairs.length) {
                            setTimeout(() => {
                                instruction.innerHTML = "Harika! Tüm çarpan çiftlerini bulup siyah kalemle işaretledik. 🎉";
                                nextBtn.style.display = "block";
                            }, 500);
                        }
                    } else {
                        firstSelection.cell.classList.remove('selected');
                        firstSelection.cell.classList.add('shake');
                        cell.classList.add('shake');
                        
                        setTimeout(() => {
                            firstSelection.cell.classList.remove('shake');
                            cell.classList.remove('shake');
                        }, 400);
                    }
                    firstSelection = null;
                }
            } 
            else if(currentPhase === 2) {
                // Kırmızı Kalem - Bölenleri Bulma
                if(cell.classList.contains('marked-red')) return;

                if(targetNumber % val === 0) {
                    cell.classList.add('marked-red', 'pop');
                    divisorsFound++;
                    
                    if(divisorsFound === validDivisors.length) {
                        setTimeout(() => {
                            instruction.innerHTML = "İnanılmaz! 🤯 Kırmızı işaretlerin hepsi siyahların üzerine geldi!<br><br><b>Demek ki bir sayının Çarpanları ile Bölenleri AYNI sayılarmış!</b>";
                            instruction.style.borderColor = "#44bd32";
                            restartBtn.style.display = "block";
                            fireConfetti();
                        }, 500);
                    }
                } else {
                    cell.classList.add('shake');
                    setTimeout(() => cell.classList.remove('shake'), 400);
                }
            }
        }

        function startPhase2() {
            currentPhase = 2;
            nextBtn.style.display = "none";
            instruction.innerHTML = `Görev 2: Şimdi <b style="color:#e84118">${targetNumber}</b> sayısını kalansız bölen sayıları seç! (Kırmızı Kalem)`;
            instruction.style.borderColor = "#ff4757";
        }

        function resetGame() {
            const options = [12, 18, 20, 24, 30, 36, 40, 48, 50];
            let newTarget = options[Math.floor(Math.random() * options.length)];
            initGame(newTarget);
            clearConfetti();
        }

        // Konfeti Kodları
        let particles = [];
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let animationTimer = null;

        function fireConfetti() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<100; i++) {
                particles.push({
                    x: canvas.width/2,
                    y: canvas.height/2,
                    r: Math.random()*6+2,
                    dx: Math.random()*10-5,
                    dy: Math.random()*10-5,
                    color: ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6'][Math.floor(Math.random()*5)]
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });
            animationTimer = requestAnimationFrame(animateConfetti);
        }
        
        function clearConfetti() {
            cancelAnimationFrame(animationTimer);
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles = [];
        }

        initGame(50);
    </script>
</body>
</html>
